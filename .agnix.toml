severity = "Warning"
target = "Generic"
tools = []
max_files_to_validate = 10000
exclude = [
    ".git/**",
    "node_modules/**",
    "target/**",
    # Canonical starter roles use Claude-compatible comma-separated `tools:`;
    # agnix currently requires a YAML list and cannot parse that native form.
    "agents/*.md",
]

[rules]
skills = true
hooks = true
agents = true
memory = true
output_styles = true
plugins = false
xml = true
mcp = true
imports = true
cross_platform = true
agents_md = true
copilot = false
cursor = false
cline = false
opencode = false
gemini_md = false
codex = true
roo_code = false
windsurf = false
kiro_steering = false
kiro_agents = false
amp_checks = false
prompt_engineering = true
generic_instructions = true
frontmatter_validation = true
xml_balance = true
import_references = true
disabled_rules = ["AS-014", "AS-015", "XML-001"]
disabled_validators = []

[tool_versions]

[spec_revisions]

[files]
include_as_memory = []
include_as_generic = []
exclude = []
