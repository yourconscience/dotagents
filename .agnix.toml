severity = "Warning"
target = "Generic"
tools = []
max_files_to_validate = 10000
exclude = [
    ".git/**",
    "node_modules/**",
    "target/**",
    "experimental/**",
    "research/**",
    "skills/jobs/tools/portals-scan/portals-scan",
    # Generated Claude-native subagent renders (agents/*.md, beside the *.yaml
    # sources). Claude Code's docs require a comma-separated `tools:` string;
    # agnix wrongly demands a YAML list and cannot parse them. dotagents doctor's
    # "plugin agents" check validates these instead.
    "agents/*.md",
    # Codex requires the package-root `skills: "./"` declaration for this
    # zero-copy package. agnix rejects bare root paths; codex_layout_test.go
    # validates the marketplace and manifest contract instead.
    "skills/.codex-plugin/plugin.json",
]

[rules]
skills = true
hooks = true
agents = true
memory = true
output_styles = true
plugins = true
xml = true
mcp = true
imports = true
cross_platform = true
agents_md = true
copilot = false
cursor = false
cline = false
opencode = false
gemini_md = false
codex = true
roo_code = false
windsurf = false
kiro_steering = false
kiro_agents = false
amp_checks = false
prompt_engineering = true
generic_instructions = true
frontmatter_validation = true
xml_balance = true
import_references = true
disabled_rules = ["AS-014", "AS-015", "XML-001"]
disabled_validators = []

[tool_versions]

[spec_revisions]

[files]
include_as_memory = []
include_as_generic = []
exclude = []
