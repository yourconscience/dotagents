version: 1
agents:
  - name: claude-code
    enabled: true
    detect: claude
    skill_root: ~/.claude/skills
    agent_root: ~/.claude/agents
  - name: codex
    enabled: true
    detect: codex
    skill_root: ~/.codex/skills
    agent_root: ~/.codex/agents
  - name: hermes
    enabled: true
    detect: hermes
    skill_root: ~/.hermes/skills
  - name: openclaw
    enabled: true
    detect: openclaw
    skill_root: ~/.openclaw/skills
mcp_servers:
  - name: linkedin
    enabled: true
    command: uvx
    args:
      - linkedin-scraper-mcp@latest
    env:
      UV_HTTP_TIMEOUT: "300"
    agents:
      - claude-code
      - codex
      - hermes
