version: 1
agents:
  - name: claude-code
    enabled: true
    skill_root: ~/.claude/skills
    agent_root: ~/.claude/agents
  - name: codex
    enabled: true
    skill_root: ~/.codex/skills
    agent_root: ~/.codex/agents
  - name: hermes
    enabled: true
    skill_root: ~/.hermes/skills
    # no agent_root: Hermes uses SOUL.md per workspace, not named agent files
  - name: openclaw
    enabled: true
    skill_root: ~/.openclaw/skills
    # no agent_root: OpenClaw uses SOUL.md/IDENTITY.md per workspace, not named agent files
