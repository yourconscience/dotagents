version: 1
agents:
  - name: claude-code
    enabled: true
    skill_root: ~/.claude/skills
    agent_root: ~/.claude/agents
  - name: codex
    enabled: true
    skill_root: ~/.codex/skills
    agent_root: ~/.codex/agents
  - name: opencode
    enabled: true
    agent_root: ~/.config/opencode/agents
    # OpenCode uses plugins/commands rather than a skills directory
