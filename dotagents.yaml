version: 1
agents:
  - name: claude-code
    enabled: true
    detect: claude
    skill_root: ~/.claude/skills
    agent_root: ~/.claude/agents
  - name: codex
    enabled: true
    detect: codex
    skill_root: ~/.codex/skills
    agent_root: ~/.codex/agents
  - name: amp
    enabled: true
    detect: amp
    skill_root: ~/.agents/skills
  - name: hermes
    enabled: true
    detect: hermes
    skill_root: ~/.hermes/skills
  - name: droid
    enabled: true
    detect: droid
    skill_root: ~/.factory/skills
    agent_root: ~/.factory/droids
  - name: openclaw
    enabled: true
    detect: openclaw
    skill_root: ~/.openclaw/skills
external_skills:
  - url: https://github.com/yourconscience/dotknow
    skill_dir: skill
    branch: main
mcp_servers:
  - name: linkedin
    enabled: true
    command: uvx
    args:
      - linkedin-scraper-mcp@latest
    env:
      UV_HTTP_TIMEOUT: "300"
    agents:
      - claude-code
      - codex
      - amp
      - hermes
      - droid
  - name: telegram_readonly
    enabled: true
    command: sh
    args:
      - -lc
      - exec uv run --project ~/.agents/mcp/telegram-readonly python ~/.agents/mcp/telegram-readonly/server.py
    agents:
      - claude-code
      - codex
      - amp
      - hermes
      - droid
