version: 1
agents:
  - name: claude-code
    enabled: true
    detect: claude
    skill_root: ~/.claude/skills
    agent_root: ~/.claude/agents
  - name: codex
    enabled: true
    detect: codex
    skill_root: ~/.codex/skills
    agent_root: ~/.codex/agents
  - name: amp
    enabled: true
    detect: amp
    skill_root: ~/.agents/skills
  - name: hermes
    enabled: true
    detect: hermes
    skill_root: ~/.hermes/skills
  - name: droid
    enabled: true
    detect: droid
    skill_root: ~/.factory/skills
    agent_root: ~/.factory/droids
  - name: openclaw
    enabled: true
    detect: openclaw
    skill_root: ~/.openclaw/skills
mcp_servers:
  - name: github
    enabled: true
    command: sh
    args:
      - -lc
      - exec ~/.agents/mcp/github/server.sh
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    agents:
      - claude-code
      - codex
  - name: linkedin
    enabled: true
    command: uvx
    args:
      - linkedin-scraper-mcp@latest
    env:
      UV_HTTP_TIMEOUT: "300"
    agents:
      - claude-code
      - codex
      - amp
      - hermes
      - droid
  - name: telegram_readonly
    enabled: true
    command: sh
    args:
      - -lc
      - exec uv run --project ~/.agents/mcp/telegram-readonly python ~/.agents/mcp/telegram-readonly/server.py
    agents:
      - claude-code
      - codex
      - amp
      - hermes
      - droid
hooks:
  - name: memory-session-start
    enabled: true
    event: SessionStart
    command: ~/.agents/memory/hooks/session-start.sh
    timeout: 15
    agents:
      - claude-code
  - name: memory-stop
    enabled: true
    event: Stop
    command: ~/.agents/memory/hooks/stop.sh
    timeout: 15
    agents:
      - claude-code
  - name: memory-session-end
    enabled: true
    event: SessionEnd
    command: ~/.agents/memory/hooks/session-end.sh
    timeout: 30
    agents:
      - claude-code
      - hermes
  - name: pr-triage-stop
    enabled: true
    event: Stop
    command: ~/.agents/skills/pr-triage/hooks/stop.sh
    timeout: 30
    agents:
      - claude-code
